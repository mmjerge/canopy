[project]
name = "canopy"
version = "0.1.0"
description = "Exploiting smooth tree priors for bandits: multi-fidelity tree bandits with regret-optimal search and fixed-budget identification."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "black>=24.8",
    "flake8>=7.0",
    "pre-commit>=4.0",
]
plot = [
    "matplotlib>=3.10",
]
llm = [
    "boto3>=1.34",
]
openai = [
    "openai>=1.0",
]
bench = [
    "boto3>=1.34",
    "datasets>=2.18",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/canopy"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
