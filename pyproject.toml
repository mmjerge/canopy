[project]
name = "canopy"
version = "0.1.0"
description = "Exploiting smooth tree priors for bandits: multi-fidelity tree bandits with regret-optimal search and fixed-budget identification."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.0",
    "ruff>=0.15.20",
    "black>=26.5.1",
    "flake8>=7.3.0",
    "mypy>=1.11",
    "pre-commit>=4.6.0",
    "sympy==1.14.0",  # mechanical verification of the certificate algebra
]
plot = [
    "matplotlib>=3.10",
]
llm = [
    "boto3>=1.43.57",
]
openai = [
    "openai>=1.0",
]
anthropic = [
    "anthropic>=0.39",
]
bench = [
    "boto3>=1.43.57",
    "datasets>=2.18",
    "tiktoken>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/canopy"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
# Target 3.12 for type-checking: numpy's bundled stubs use PEP 695 `type`
# statements, which mypy only parses under a >=3.12 target. Runtime support for
# 3.10+ is covered by the test matrix.
python_version = "3.12"
mypy_path = "src"
files = ["src/canopy"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["canopy"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
